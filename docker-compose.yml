version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: budget_db_container
    restart: always
    environment:
      POSTGRES_DB: budget_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "6667:5432"
    volumes:
      - ./backend/psql_db:/var/lib/postgresql/data
      - ./backend/init_db:/docker-entrypoint-initdb.d

  backend:
    build:
      context: ./backend
    container_name: budget_api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/budget_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db
    ports:
      - "1001:8080"
