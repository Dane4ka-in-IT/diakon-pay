<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Смена Email — DiakonPay</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; color: #333; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 30px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: linear-gradient(135deg, #0d6efd, #0a58ca); padding: 30px; text-align: center; color: #fff; font-size: 22px; font-weight: bold; }
        .body { padding: 30px; font-size: 16px; line-height: 1.7; }
        .code-box { margin: 24px auto; text-align: center; background: #f0f5ff; border: 2px dashed #0d6efd; border-radius: 8px; padding: 20px; }
        .code { font-size: 42px; font-weight: bold; letter-spacing: 10px; color: #0d6efd; }
        .note { font-size: 13px; color: #888; margin-top: 20px; }
        .footer { text-align: center; padding: 20px; font-size: 12px; color: #aaa; background: #fafafa; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">DiakonPay — Смена Email</div>
    <div class="body">
        <p>Здравствуйте, <b th:text="${userName}">Пользователь</b>!</p>
        <p>Поступил запрос на смену вашего email на: <b th:text="${newEmail}">new@email.com</b>.</p>
        <p>Для подтверждения введите код:</p>
        <div class="code-box">
            <div class="code" th:text="${code}">0000</div>
        </div>
        <p class="note">Код действителен 10 минут. Если вы не запрашивали смену email — проигнорируйте это письмо.</p>
    </div>
    <div class="footer">С уважением, команда diakon-team!</div>
</div>
</body>
</html>
